services:
  wiki:
    image: madhouse-wiki:vps-${MADHOUSE_RELEASE_SHA:?MADHOUSE_RELEASE_SHA is required}
    command: ["wiki"]
    restart: unless-stopped
    stop_grace_period: 50s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    mem_limit: 1280m
    pids_limit: 160
    ports:
      - 127.0.0.1:9092:9092
    env_file:
      - /opt/madhouse-wiki/storage.env
      - /opt/madhouse-wiki/wiki.env
      - /opt/madhouse-wiki/raid.env
    environment:
      MADHOUSE_SERVICE: wiki
      MADHOUSE_AUTOMATION_STATE_DIR: /data/automation
      MADHOUSE_VPS_INLINE_CARDS: "0"
      MADHOUSE_INLINE_CARDS_CACHE_DIR: /data/telegram-cards
      MADHOUSE_RELEASE_SHA: ${MADHOUSE_RELEASE_SHA}
      MADHOUSE_MINIMUM_SAFE_RELEASE_SHA: ${MADHOUSE_MINIMUM_SAFE_RELEASE_SHA:-}
      MADHOUSE_HOST_CONFIG_VERSION: "1"
      PORT: 9092
      WIKI_PUBLIC_ORIGIN: https://madhouse-wiki.ru
      CONNECTOR_PUBLIC_ORIGIN: https://connect.madhouse-wiki.ru
      MADHOUSE_STORAGE_ORIGIN: https://storage.madhouse-wiki.ru/_madhouse-storage
    volumes:
      - automation_state:/data/automation
      - telegram_cards:/data/telegram-cards
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9092/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

  connector:
    image: madhouse-wiki:vps-${MADHOUSE_RELEASE_SHA:?MADHOUSE_RELEASE_SHA is required}
    command: ["connector"]
    restart: unless-stopped
    stop_grace_period: 50s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    mem_limit: 384m
    pids_limit: 96
    ports:
      - 127.0.0.1:9093:9093
    env_file:
      - /opt/madhouse-wiki/storage.env
      - /opt/madhouse-wiki/connector.env
    environment:
      MADHOUSE_SERVICE: connector
      MADHOUSE_RELEASE_SHA: ${MADHOUSE_RELEASE_SHA}
      PORT: 9093
      WIKI_PUBLIC_ORIGIN: https://madhouse-wiki.ru
      CONNECTOR_PUBLIC_ORIGIN: https://connect.madhouse-wiki.ru
      MADHOUSE_STORAGE_ORIGIN: https://storage.madhouse-wiki.ru/_madhouse-storage

volumes:
  automation_state:
  telegram_cards:
