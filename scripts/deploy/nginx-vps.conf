server {
    listen 80;
    server_name madhouse-wiki.ru connect.madhouse-wiki.ru;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/madhouse-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name madhouse-wiki.ru;

    ssl_certificate /etc/letsencrypt/live/madhouse-wiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madhouse-wiki.ru/privkey.pem;

    access_log off;
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:9092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name connect.madhouse-wiki.ru;

    ssl_certificate /etc/letsencrypt/live/madhouse-wiki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madhouse-wiki.ru/privkey.pem;

    access_log off;
    client_max_body_size 20k;

    location / {
        proxy_pass http://127.0.0.1:9093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
