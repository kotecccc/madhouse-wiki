services:
  raid-worker:
    image: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    container_name: madhouse-raid-worker
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    env_file: .env
    working_dir: /app
    volumes:
      - ./app:/app:ro
    tmpfs: [/tmp:uid=1000, gid=1000, mode=0700, size=32m]
    command: [node, --max-old-space-size=96, worker.mjs]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
