services:
  storage:
    image: node:24-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
    container_name: madhouse-storage
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    env_file: .env
    ports: ["127.0.0.1:9091:9091"]
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./data:/data
    command: [node, --max-old-space-size=64, /app/server.mjs]
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
