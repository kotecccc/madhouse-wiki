name: Build and publish VPS release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: madhouse-wiki-vps-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the exact GitHub source commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Validate release version and changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(gh release view --json tagName --jq .tagName)"
          if [[ ! "${latest_tag}" =~ ^vps-([0-9a-f]{40})$ ]]; then
            echo "Latest release is not a VPS release" >&2
            exit 1
          fi
          previous_sha="${BASH_REMATCH[1]}"
          git fetch --depth=1 origin "${previous_sha}"
          previous_version="$(git show "${previous_sha}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          node scripts/deploy/release-version.mjs "${previous_version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Bridge bootstrap digest
        id: bridge
        run: echo "sha=$(node scripts/bridge/release-config.mjs)" >> "$GITHUB_OUTPUT"

      - name: Validate and build the immutable VPS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vps
          platforms: linux/amd64
          pull: true
          load: true
          tags: madhouse-wiki:vps-${{ github.sha }}
          build-args: |
            MADHOUSE_RELEASE_SHA=${{ github.sha }}
            VITE_TELEGRAM_CONNECTOR_ORIGIN=https://connect.madhouse-wiki.ru
            VITE_MADHOUSE_BRIDGE_BOOTSTRAP_SHA256=${{ steps.bridge.outputs.sha }}
          cache-from: type=gha,scope=vps-build
          cache-to: type=gha,scope=vps-build,mode=max,ignore-error=true

      - name: Validate VPS Compose configuration
        run: |
          config_root="$(mktemp -d)"
          for name in storage.env wiki.env connector.env raid.env bridge.env; do
            : > "${config_root}/${name}"
          done
          sed "s|/opt/madhouse-wiki|${config_root}|g" \
            scripts/deploy/vps-compose.yml > "${config_root}/vps-compose.yml"
          sed "s|/opt/madhouse-wiki|${config_root}|g" \
            scripts/deploy/vps-bridge-compose.yml > "${config_root}/vps-bridge-compose.yml"
          printf 'MADHOUSE_RELEASE_SHA=%040d\n' 0 > "${config_root}/release.env"
          docker compose \
            --project-name madhouse-wiki \
            --file "${config_root}/vps-compose.yml" \
            --env-file "${config_root}/release.env" \
            config --quiet
          docker compose \
            --project-name madhouse-wiki \
            --file "${config_root}/vps-compose.yml" \
            --file "${config_root}/vps-bridge-compose.yml" \
            --env-file "${config_root}/release.env" \
            config --quiet

      - name: Exercise both services without production credentials
        run: |
          wiki_name="madhouse-wiki-smoke-wiki-${GITHUB_RUN_ID}"
          connector_name="madhouse-wiki-smoke-connector-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "${wiki_name}" "${connector_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "${wiki_name}" \
            --init \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m,mode=1777 \
            --tmpfs /data/automation:rw,nosuid,nodev,size=32m,uid=1000,gid=1000,mode=0700 \
            --env MADHOUSE_AUTOMATION_STATE_DIR=/data/automation \
            --env MADHOUSE_AUTOMATION_GAME_ENABLED=0 \
            --env WIKI_PUBLIC_ORIGIN=https://wiki.test \
            --env CONNECTOR_PUBLIC_ORIGIN=https://connector.test \
            --env MADHOUSE_BRIDGE_LAB=1 \
            --env MADHOUSE_BRIDGE_IPC_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env MADHOUSE_BRIDGE_STATE_DIR=/tmp/bridge-state \
            --env MADHOUSE_BRIDGE_WITNESS_PATH=/tmp/bridge-witness.sqlite \
            --env MADHOUSE_BRIDGE_PROVISION_WITNESS=1 \
            --env TELEGRAM_BOT_TOKEN=fake-bot \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 1280m \
            --pids-limit 160 \
            --publish 127.0.0.1:19092:9092 \
            "madhouse-wiki:vps-${GITHUB_SHA}" wiki >/dev/null
          docker run --detach --name "${connector_name}" \
            --init \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env WIKI_PUBLIC_ORIGIN=https://wiki.test \
            --env CONNECTOR_PUBLIC_ORIGIN=https://connector.test \
            --env MADHOUSE_BRIDGE_LAB=1 \
            --env MADHOUSE_BRIDGE_IPC_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --env WIKI_INITDATA_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --memory 384m \
            --pids-limit 96 \
            --publish 127.0.0.1:19093:9093 \
            "madhouse-wiki:vps-${GITHUB_SHA}" connector >/dev/null
          SMOKE_WIKI_ORIGIN=https://wiki.test SMOKE_CONNECTOR_ORIGIN=https://connector.test node scripts/deploy/smoke-vps-image.mjs \
            http://127.0.0.1:19092 \
            http://127.0.0.1:19093 \
            "${GITHUB_SHA}"

      - name: Package the image and checksum
        run: |
          docker save "madhouse-wiki:vps-${GITHUB_SHA}" | gzip -1 > madhouse-wiki-image.tar.gz
          sha256sum madhouse-wiki-image.tar.gz > madhouse-wiki-image.tar.gz.sha256

      - name: Publish the verified image as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vps-${GITHUB_SHA}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "A VPS release for this source commit already exists" >&2
            exit 1
          fi
          gh release create "${tag}" \
            madhouse-wiki-image.tar.gz \
            madhouse-wiki-image.tar.gz.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Madhouse Wiki VPS ${GITHUB_SHA:0:12}" \
            --notes "Verified immutable VPS image for source commit ${GITHUB_SHA}. The VPS release timer downloads this public asset, verifies its SHA-256 checksum, and activates it with health-check rollback."
