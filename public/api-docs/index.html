<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Madhouse — просмотр данных</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
    />
    <style>
      .swagger-ui .auth-wrapper,
      .swagger-ui .authorization__btn {
        display: none;
      }
      .swagger-ui .information-container {
        display: none;
      }
    </style>
  </head>
  <body>
    <p class="wiki-auth-banner">
      <a href="/">Login в Wiki</a> •
      <span id="wiki-auth-status" role="status"></span>
    </p>
    <p>
      <label>
        <input id="api-mutations-enabled" type="checkbox" />
        Разрешить изменяющие запросы POST, PUT, PATCH и DELETE для этой страницы
        Swagger
      </label>
      <span> — могут изменить состояние игры или аккаунта.</span>
    </p>
    <p>
      События и методы SignalR описаны в
      <a href="./realtime.json">отдельной спецификации</a>.
    </p>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script type="module" src="./wiki-auth.js"></script>
  </body>
</html>
